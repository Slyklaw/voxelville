<!DOCTYPE html>
<html>
<head><title>Three.js Direct Test</title>
<style>*{margin:0;padding:0}body{background:#111}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(5, 5, 5);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(5, 10, 5);
scene.add(dir);

// Test 1: Simple Mesh (not instanced)
const box = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshLambertMaterial({color: 0xff0000})
);
box.position.set(0, 0.5, 0);
scene.add(box);

// Test 2: InstancedMesh with per-instance color
const geo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
const mat = new THREE.MeshLambertMaterial({color: 0xffffff, flatShading: true});
const instanced = new THREE.InstancedMesh(geo, mat, 10);
instanced.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

const d = new THREE.Object3D();
const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
for (let i = 0; i < 5; i++) {
  d.position.set(i * 1.2 - 2.4, 0.5, -2);
  d.updateMatrix();
  instanced.setMatrixAt(i, d.matrix);
  instanced.setColorAt(i, new THREE.Color(colors[i]));
}
instanced.count = 5;
instanced.instanceMatrix.needsUpdate = true;
if (instanced.instanceColor) instanced.instanceColor.needsUpdate = true;
scene.add(instanced);

console.log('Rendering...');
renderer.render(scene, camera);

// Verify pixels
const gl = renderer.getContext();
const px = new Uint8Array(4);
gl.readPixels(Math.floor(canvas.width/2), Math.floor(canvas.height/2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
console.log('Center pixel:', px[0], px[1], px[2], px[3]);

// Animation
function animate() {
  requestAnimationFrame(animate);
  box.rotation.y += 0.01;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
